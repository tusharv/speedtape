name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Plan version and changelog
        id: plan
        env:
          RELEASE_NOTES_PATH: ${{ runner.temp }}/RELEASE_NOTES.md
        run: npx tsx scripts/release.ts

      - name: Bump package version
        if: steps.plan.outputs.version != ''
        run: npm version "${{ steps.plan.outputs.version }}" --no-git-tag-version

      - name: Commit, tag, and push
        if: steps.plan.outputs.version != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "chore(release): ${{ steps.plan.outputs.version }}"
          git tag "${{ steps.plan.outputs.tag }}"
          git push origin "HEAD:${{ github.ref_name }}"
          git push origin "${{ steps.plan.outputs.tag }}"

      - name: Publish GitHub Release
        if: steps.plan.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.plan.outputs.tag }}" \
            --title "${{ steps.plan.outputs.tag }}" \
            --notes-file "${{ steps.plan.outputs.notes_path }}"
